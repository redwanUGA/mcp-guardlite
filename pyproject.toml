[project]
name = "mcpguardlite"
version = "0.1.0.dev0"
description = "Failure-aware compression and runtime recovery for tool-using LLM agents at the edge"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
mcpguardlite = "mcpguardlite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
